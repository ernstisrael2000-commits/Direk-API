<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct API — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&f[]=clash-grotesk@600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Satoshi', sans-serif; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3 { font-family: 'Clash Grotesk', sans-serif; }
    body { visibility: hidden }
    [v-cloak] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js" defer init></script>
  <script>(async()=>{try{const r=await fetch('/api/v1/auth/me');if(r.status===401){window.location.replace('/login')}else{document.body.style.visibility='visible'}}catch(e){document.body.style.visibility='visible'}})();</script>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex flex-col">

<div v-cloak v-scope="{
  showAddForm: false,
  products: [
    { id: 1, game: 'Free Fire', name: '100 Diamants', code: 'ff_100d', prix_achat: 100, prix_vente: 150, actif: true },
    { id: 2, game: 'Free Fire', name: '210 Diamants', code: 'ff_210d', prix_achat: 200, prix_vente: 300, actif: true },
    { id: 3, game: 'Free Fire', name: '500 Diamants', code: 'ff_500d', prix_achat: 430, prix_vente: 650, actif: true },
    { id: 4, game: 'Free Fire', name: '1060 Diamants', code: 'ff_1060d', prix_achat: 850, prix_vente: 1200, actif: false }
  ]
}" class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="shrink-0 pt-14 px-6 pb-4 bg-white border-b border-slate-100 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#1E40AF] to-[#3B82F6] flex items-center justify-center">
        <iconify-icon icon="lucide:shield" class="text-white text-xl"></iconify-icon>
      </div>
      <div>
        <h1 class="text-lg font-bold text-slate-900">Admin Panel</h1>
        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Direct API</p>
      </div>
    </div>
    <a href="/" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 border border-slate-100">
      <iconify-icon icon="lucide:layout-grid" class="text-xl"></iconify-icon>
    </a>
  </header>

  <main class="flex-1 overflow-y-auto px-6 py-6 space-y-6">

    <!-- Stats row -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm text-center">
        <p class="text-2xl font-bold text-slate-900">4</p>
        <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Produits</p>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm text-center">
        <p class="text-2xl font-bold text-emerald-600">3</p>
        <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Actifs</p>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm text-center">
        <p class="text-2xl font-bold text-red-500">1</p>
        <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Inactifs</p>
      </div>
    </div>

    <!-- Section titre + bouton ajouter -->
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wide">Catalogue Produits</h2>
      <button @click="showAddForm = !showAddForm"
        class="flex items-center gap-2 px-4 py-2 bg-gradient-to-br from-[#1E40AF] to-[#3B82F6] text-white rounded-xl text-xs font-bold shadow-md shadow-blue-200">
        <iconify-icon icon="lucide:plus"></iconify-icon>
        Ajouter
      </button>
    </div>

    <!-- Formulaire ajout (toggle) -->
    <div v-if="showAddForm" class="bg-white rounded-2xl p-5 border border-blue-100 shadow-sm space-y-4">
      <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
        <iconify-icon icon="lucide:package-plus" class="text-blue-600"></iconify-icon>
        Nouveau produit
      </h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2 space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Jeu / Fournisseur</label>
          <input type="text" placeholder="ex: Free Fire"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
        <div class="col-span-2 space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Nom du produit</label>
          <input type="text" placeholder="ex: 100 Diamants"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
        <div class="col-span-2 space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Code produit</label>
          <input type="text" placeholder="ex: ff_100d"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Prix achat (HTG)</label>
          <input type="number" placeholder="0"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Prix vente (HTG)</label>
          <input type="number" placeholder="0"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button class="flex-1 py-3 bg-gradient-to-br from-[#1E40AF] to-[#3B82F6] text-white rounded-xl text-sm font-bold">
          Enregistrer
        </button>
        <button @click="showAddForm = false"
          class="flex-1 py-3 bg-slate-50 text-slate-500 rounded-xl text-sm font-bold border border-slate-200">
          Annuler
        </button>
      </div>
    </div>

    <!-- Liste des produits -->
    <div class="space-y-3">
      <div v-for="p in products" :key="p.id"
        class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="p-4 flex items-start justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center text-orange-500 shrink-0">
              <iconify-icon icon="lucide:gamepad-2" class="text-xl"></iconify-icon>
            </div>
            <div>
              <p class="text-sm font-bold text-slate-900">{{ p.name }}</p>
              <p class="text-[10px] text-slate-400 font-medium">{{ p.game }} • <code class="font-mono">{{ p.code }}</code></p>
            </div>
          </div>
          <!-- Toggle actif -->
          <div class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" :checked="p.actif" @change="p.actif = !p.actif">
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
          </div>
        </div>
        <div class="px-4 pb-4 flex gap-4">
          <div class="flex-1 bg-slate-50 rounded-xl p-3 text-center border border-slate-100">
            <p class="text-[10px] text-slate-400 font-bold uppercase">Achat</p>
            <p class="text-sm font-bold text-slate-700 mt-0.5">{{ p.prix_achat }} HTG</p>
          </div>
          <div class="flex-1 bg-blue-50 rounded-xl p-3 text-center border border-blue-100">
            <p class="text-[10px] text-blue-400 font-bold uppercase">Vente</p>
            <p class="text-sm font-bold text-blue-700 mt-0.5">{{ p.prix_vente }} HTG</p>
          </div>
          <div class="flex-1 bg-emerald-50 rounded-xl p-3 text-center border border-emerald-100">
            <p class="text-[10px] text-emerald-400 font-bold uppercase">Marge</p>
            <p class="text-sm font-bold text-emerald-700 mt-0.5">{{ p.prix_vente - p.prix_achat }} HTG</p>
          </div>
        </div>
        <div class="border-t border-slate-50 px-4 py-2 flex gap-2">
          <button class="flex-1 py-2 text-xs font-bold text-blue-600 flex items-center justify-center gap-1.5 rounded-lg hover:bg-blue-50 transition-colors">
            <iconify-icon icon="lucide:pencil" class="text-sm"></iconify-icon> Modifier
          </button>
          <button class="flex-1 py-2 text-xs font-bold text-red-500 flex items-center justify-center gap-1.5 rounded-lg hover:bg-red-50 transition-colors">
            <iconify-icon icon="lucide:trash-2" class="text-sm"></iconify-icon> Supprimer
          </button>
        </div>
      </div>
    </div>

  </main>

</div>
</body>
</html>
