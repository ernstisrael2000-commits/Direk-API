<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct API — Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&f[]=clash-grotesk@600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Satoshi', sans-serif; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3 { font-family: 'Clash Grotesk', sans-serif; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js" defer init></script>
</head>
<body class="min-h-screen bg-[#F8FAFC] flex flex-col">

<div v-scope="{ tab: 'login' }" class="flex flex-col min-h-screen">

  <!-- Header gradient -->
  <div class="bg-gradient-to-br from-[#1E40AF] via-[#3B82F6] to-[#7C3AED] pt-16 pb-12 px-6 flex flex-col items-center text-white">
    <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mb-4 border border-white/30">
      <iconify-icon icon="lucide:zap" class="text-3xl text-white"></iconify-icon>
    </div>
    <h1 class="text-2xl font-bold tracking-tight">Direct API</h1>
    <p class="text-blue-200 text-sm mt-1">Plateforme de recharge pour resellers</p>
  </div>

  <!-- Card -->
  <div class="flex-1 px-6 -mt-6">
    <div class="bg-white rounded-[28px] shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden">

      <!-- Tabs -->
      <div class="flex border-b border-slate-100">
        <button @click="tab = 'login'"
          :class="tab === 'login' ? 'text-blue-600 border-b-2 border-blue-600 font-bold' : 'text-slate-400 font-medium'"
          class="flex-1 py-4 text-sm transition-colors">
          Connexion
        </button>
        <button @click="tab = 'signup'"
          :class="tab === 'signup' ? 'text-blue-600 border-b-2 border-blue-600 font-bold' : 'text-slate-400 font-medium'"
          class="flex-1 py-4 text-sm transition-colors">
          Créer un compte
        </button>
      </div>

      <!-- Login form -->
      <div v-if="tab === 'login'" class="p-6 space-y-4">
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Email</label>
          <input type="email" placeholder="votre@email.com"
            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Mot de passe</label>
          <div class="relative">
            <input type="password" placeholder="••••••••"
              class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all pr-12">
            <button class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-slate-400">
              <iconify-icon icon="lucide:eye"></iconify-icon>
            </button>
          </div>
        </div>
        <div class="flex justify-end">
          <a href="#" class="text-xs font-semibold text-blue-600">Mot de passe oublié ?</a>
        </div>
        <a href="/" class="block w-full py-4 bg-gradient-to-br from-[#1E40AF] to-[#3B82F6] text-white rounded-2xl font-bold text-sm text-center shadow-lg shadow-blue-200 transition-transform active:scale-95 mt-2">
          Se connecter
        </a>
      </div>

      <!-- Signup form -->
      <div v-if="tab === 'signup'" class="p-6 space-y-4">
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Nom complet</label>
          <input type="text" placeholder="Jean Dupont"
            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Email</label>
          <input type="email" placeholder="votre@email.com"
            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Téléphone</label>
          <input type="tel" placeholder="+509 3XXX-XXXX"
            class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Mot de passe</label>
          <div class="relative">
            <input type="password" placeholder="••••••••"
              class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all pr-12">
            <button class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-slate-400">
              <iconify-icon icon="lucide:eye"></iconify-icon>
            </button>
          </div>
        </div>
        <button class="w-full py-4 bg-gradient-to-br from-[#1E40AF] to-[#3B82F6] text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-200 transition-transform active:scale-95 mt-2">
          Créer mon compte
        </button>
        <p class="text-[10px] text-slate-400 text-center leading-relaxed">
          En créant un compte, vous acceptez nos conditions d'utilisation.
          Votre clé API sera générée automatiquement.
        </p>
      </div>

    </div>
  </div>

  <p class="text-center text-[10px] text-slate-400 font-medium py-6">v1.0.0 • © 2025 Direct API Haiti</p>

</div>
</body>
</html>
