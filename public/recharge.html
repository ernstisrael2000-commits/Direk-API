<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direk API — Recharger le compte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&f[]=clash-grotesk@600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Satoshi', sans-serif; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3 { font-family: 'Clash Grotesk', sans-serif; }
  </style>
  <meta name="view-transition" content="same-origin">
  <script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js" defer init></script>
</head>
<body>
<div v-scope="{
  montant: '',
  loading: false,
  error: null,
  fraisPercent: 1.5,
  get montantNum() { return parseFloat(this.montant) || 0 },
  get frais() { return parseFloat((this.montantNum * this.fraisPercent / 100).toFixed(2)) },
  get total() { return parseFloat((this.montantNum + this.frais).toFixed(2)) },
  get montantValide() { return this.montantNum >= 20 },
  addAmount(v) { this.montant = String((this.montantNum + v) || v) },
  async recharger() {
    if (!this.montantValide) { this.error = 'Montant minimum : 20 HTG.'; return }
    this.loading = true; this.error = null;
    try {
      const r = await fetch('/api/v1/wallet/topup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ montant_htg: this.montantNum })
      });
      const d = await r.json();
      if (d.ok && d.url) {
        window.location.href = d.url;
      } else {
        this.error = d.error || 'Une erreur est survenue.';
      }
    } catch(e) {
      this.error = 'Impossible de joindre le serveur.';
    }
    this.loading = false;
  }
}" class="w-full h-screen flex flex-col bg-[#F8FAFC]">

  <!-- Header -->
  <header class="shrink-0 pt-14 px-6 flex items-center bg-white pb-4 border-b border-slate-50">
    <a href="/" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-900 bg-slate-50 mr-4">
      <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
    </a>
    <h1 class="text-lg font-bold text-slate-900">Recharger le compte</h1>
  </header>

  <main class="flex-1 overflow-y-auto px-6 py-6 space-y-6">

    <!-- Montant -->
    <div class="bg-white rounded-[28px] p-6 shadow-sm border border-slate-100">
      <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Montant à recharger</label>
      <div class="relative flex items-center">
        <input
          type="number"
          placeholder="0"
          min="20"
          v-model="montant"
          class="w-full bg-slate-50 border-none rounded-2xl py-5 px-6 text-2xl font-bold text-slate-900 focus:ring-2 focus:ring-blue-600 focus:outline-none placeholder:text-slate-300"
        >
        <span class="absolute right-6 text-lg font-bold text-slate-400">HTG</span>
      </div>
      <!-- Raccourcis montant -->
      <div class="grid grid-cols-3 gap-2 mt-4">
        <button @click="addAmount(500)"  class="py-2 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-600 active:scale-95 transition-transform">+ 500</button>
        <button @click="addAmount(1000)" class="py-2 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-600 active:scale-95 transition-transform">+ 1 000</button>
        <button @click="addAmount(5000)" class="py-2 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-600 active:scale-95 transition-transform">+ 5 000</button>
      </div>
    </div>

    <!-- Résumé frais -->
    <div class="bg-white rounded-2xl p-5 border border-slate-100 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs text-slate-500">Sous-total</span>
        <span class="text-sm font-bold text-slate-900">{{ montantNum.toLocaleString('fr') }} HTG</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-xs text-slate-500">Frais de transaction ({{ fraisPercent }}%)</span>
        <span class="text-sm font-bold text-slate-900">{{ frais.toLocaleString('fr') }} HTG</span>
      </div>
      <div class="h-px bg-slate-50 w-full my-1"></div>
      <div class="flex justify-between items-center">
        <span class="text-sm font-bold text-slate-900">Total à payer</span>
        <span class="text-lg font-bold text-blue-600">{{ total.toLocaleString('fr') }} HTG</span>
      </div>
    </div>

    <!-- Message d'erreur -->
    <div v-if="error" class="bg-red-50 border border-red-100 rounded-2xl px-5 py-4 flex items-center gap-3">
      <iconify-icon icon="lucide:alert-circle" class="text-red-500 text-xl shrink-0"></iconify-icon>
      <p class="text-sm font-medium text-red-700">{{ error }}</p>
    </div>

    <!-- CTA -->
    <div class="flex flex-col gap-3 pt-2">
      <button
        @click="recharger"
        :disabled="loading || !montantValide"
        :class="loading || !montantValide
          ? 'bg-slate-300 cursor-not-allowed'
          : 'bg-gradient-to-br from-[#1E40AF] to-[#3B82F6] shadow-lg shadow-blue-200 active:scale-95'"
        class="w-full py-4 text-white rounded-2xl font-bold text-sm transition-all flex items-center justify-center gap-2"
      >
        <iconify-icon v-if="loading" icon="lucide:loader-2" class="text-xl animate-spin"></iconify-icon>
        <iconify-icon v-else icon="lucide:plus-circle" class="text-xl"></iconify-icon>
        <span>{{ loading ? 'Redirection en cours…' : 'Recharger' }}</span>
      </button>
      <a href="/" class="w-full py-4 text-center text-slate-400 font-bold text-sm">Annuler</a>
    </div>

  </main>

  <!-- Bottom nav -->
  <footer class="shrink-0 pb-[34px] px-6 py-4 bg-white border-t border-slate-100">
    <nav class="flex items-center justify-around">
      <a href="/"           class="flex flex-col items-center gap-1 text-xs text-slate-400 font-medium"><iconify-icon icon="lucide:layout-grid" class="text-2xl"></iconify-icon><span>Home</span></a>
      <a href="/historique" class="flex flex-col items-center gap-1 text-xs text-slate-400 font-medium"><iconify-icon icon="lucide:history" class="text-2xl"></iconify-icon><span>Historique</span></a>
      <a href="/api-doc"    class="flex flex-col items-center gap-1 text-xs text-slate-400 font-medium"><iconify-icon icon="lucide:code-2" class="text-2xl"></iconify-icon><span>API Doc</span></a>
      <a href="/profil"     class="flex flex-col items-center gap-1 text-xs text-slate-400 font-medium"><iconify-icon icon="lucide:settings" class="text-2xl"></iconify-icon><span>Profil</span></a>
    </nav>
  </footer>

</div>
</body>
</html>
