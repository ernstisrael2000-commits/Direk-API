<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Direct API — Recharger le compte</title><script src="https://cdn.tailwindcss.com"></script><script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&f[]=clash-grotesk@600&display=swap" rel="stylesheet"><style>body { font-family: 'Satoshi', sans-serif; -webkit-tap-highlight-color: transparent; } h1, h2, h3 { font-family: 'Clash Grotesk', sans-serif; }</style>
<meta name="view-transition" content="same-origin">
<script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js" defer init></script>
</head><body><div class="w-full h-screen flex flex-col bg-[#F8FAFC]">
<header class="shrink-0 pt-14 px-6 flex items-center bg-white pb-4 border-b border-slate-50"><a id="back-btn" href="/" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-900 bg-slate-50 mr-4"><iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon></a><h1 class="text-lg font-bold text-slate-900">Recharger le compte</h1></header>
<main class="flex-1 overflow-y-auto px-6 py-6 space-y-6"><div class="flex justify-between items-center px-2"><div class="flex flex-col items-center gap-2 text-blue-600"><div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">1</div><span class="text-[10px] font-bold uppercase tracking-tight">Montant</span></div><div class="flex-1 h-px bg-slate-200 mx-2 mb-6"></div><div class="flex flex-col items-center gap-2 text-slate-300"><div class="w-8 h-8 rounded-full border-2 border-slate-200 flex items-center justify-center text-xs font-bold">2</div><span class="text-[10px] font-bold uppercase tracking-tight">Paiement</span></div><div class="flex-1 h-px bg-slate-200 mx-2 mb-6"></div><div class="flex flex-col items-center gap-2 text-slate-300"><div class="w-8 h-8 rounded-full border-2 border-slate-200 flex items-center justify-center text-xs font-bold">3</div><span class="text-[10px] font-bold uppercase tracking-tight">Confirmation</span></div></div><div class="bg-white rounded-[28px] p-6 shadow-sm border border-slate-100"><label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Montant à recharger</label><div class="relative flex items-center"><input type="number" placeholder="0.00" class="w-full bg-slate-50 border-none rounded-2xl py-5 px-6 text-2xl font-bold text-slate-900 focus:ring-2 focus:ring-blue-600 focus:outline-none placeholder:text-slate-300"><span class="absolute right-6 text-lg font-bold text-slate-400">HTG</span></div><div class="grid grid-cols-3 gap-2 mt-4"><button class="py-2 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-600">+ 500</button><button class="py-2 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-600">+ 1,000</button><button class="py-2 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-600">+ 5,000</button></div></div><div class="space-y-4"><h2 class="text-sm font-bold text-slate-900 uppercase tracking-wide px-1">Méthode de paiement</h2><div class="grid grid-cols-2 gap-3"><button id="select-moncash" class="relative p-4 rounded-2xl border-2 border-blue-600 bg-blue-50/50 flex flex-col items-center gap-3 transition-all"><div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-blue-600"><iconify-icon icon="lucide:smartphone" class="text-2xl"></iconify-icon></div><span class="text-xs font-bold text-blue-900">MonCash</span><div class="absolute top-2 right-2 w-5 h-5 bg-blue-600 rounded-full flex items-center justify-center"><iconify-icon icon="lucide:check" class="text-white text-xs"></iconify-icon></div></button><button id="select-natcash" class="p-4 rounded-2xl border-2 border-slate-100 bg-white flex flex-col items-center gap-3 grayscale opacity-60 transition-all"><div class="w-10 h-10 rounded-full bg-slate-50 shadow-sm flex items-center justify-center text-slate-400"><iconify-icon icon="lucide:smartphone" class="text-2xl"></iconify-icon></div><span class="text-xs font-bold text-slate-600">NatCash</span></button></div></div><div class="bg-white rounded-2xl p-5 border border-slate-100 space-y-3"><div class="flex justify-between items-center"><span class="text-xs text-slate-500">Sous-total</span><span class="text-sm font-bold text-slate-900">0.00 HTG</span></div><div class="flex justify-between items-center"><span class="text-xs text-slate-500">Frais de transaction (1.5%)</span><span class="text-sm font-bold text-slate-900">0.00 HTG</span></div><div class="h-px bg-slate-50 w-full my-1"></div><div class="flex justify-between items-center"><span class="text-sm font-bold text-slate-900">Total à payer</span><span class="text-lg font-bold text-blue-600">0.00 HTG</span></div></div><div class="flex flex-col gap-3 pt-2"><button id="cta-confirm" class="w-full py-4 bg-gradient-to-br from-[#1E40AF] to-[#3B82F6] text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-200 transition-transform active:scale-95">Continuer vers MonCash</button><a id="cta-cancel" href="/" class="w-full py-4 text-center text-slate-400 font-bold text-sm">Annuler</a></div></main>
<div v-scope="{ ...{&quot;activeItem&quot;:&quot;home&quot;,&quot;homeHref&quot;:&quot;/&quot;,&quot;historyHref&quot;:&quot;/historique&quot;,&quot;apiHref&quot;:&quot;/api-doc&quot;,&quot;profileHref&quot;:&quot;/profil&quot;}, $emit() {} }">
<footer class="shrink-0 pb-[34px] px-6 py-4 bg-white border-t border-slate-100">
  <nav class="flex items-center justify-around">
    <a :href="homeHref" :class="{ 'text-blue-600 font-bold': activeItem === 'home', 'text-slate-400 font-medium': activeItem !== 'home' }" class="flex flex-col items-center gap-1 text-xs"><iconify-icon icon="lucide:layout-grid" class="text-2xl"></iconify-icon><span>Home</span></a>
    <a :href="historyHref" :class="{ 'text-blue-600 font-bold': activeItem === 'history', 'text-slate-400 font-medium': activeItem !== 'history' }" class="flex flex-col items-center gap-1 text-xs"><iconify-icon icon="lucide:history" class="text-2xl"></iconify-icon><span>Historique</span></a>
    <a :href="apiHref" :class="{ 'text-blue-600 font-bold': activeItem === 'api', 'text-slate-400 font-medium': activeItem !== 'api' }" class="flex flex-col items-center gap-1 text-xs"><iconify-icon icon="lucide:code-2" class="text-2xl"></iconify-icon><span>API Doc</span></a>
    <a :href="profileHref" :class="{ 'text-blue-600 font-bold': activeItem === 'profile', 'text-slate-400 font-medium': activeItem !== 'profile' }" class="flex flex-col items-center gap-1 text-xs"><iconify-icon icon="lucide:settings" class="text-2xl"></iconify-icon><span>Profil</span></a>
  </nav>
</footer>
</div>
</div></body></html>
